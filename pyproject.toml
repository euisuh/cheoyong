[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cheoyong"
version = "0.1.0"
description = "Policy enforcement between an LLM agent and its tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pyyaml>=6"]

[project.scripts]
cheoyong-demo = "cheoyong.demo:main"

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Repository = "https://github.com/euisuh/cheoyong"

[tool.hatch.build.targets.wheel]
packages = ["cheoyong"]
