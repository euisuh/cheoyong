[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cheoyong"
version = "0.1.0"
description = "Policy enforcement between an LLM agent and its tools"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["pyyaml>=6"]

[project.scripts]
cheoyong-demo = "cheoyong.demo:main"
cheoyong-hook = "cheoyong.hook:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.urls]
Repository = "https://github.com/euisuh/cheoyong"

[tool.hatch.build.targets.wheel]
packages = ["cheoyong"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# ruff defaults (pyflakes + syntax-level pycodestyle).
select = ["E4", "E7", "E9", "F"]
